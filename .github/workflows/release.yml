name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # for npm provenance

jobs:
  publish:
    name: 'Publish to npm'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # needed to check the release commit is on main
      - name: Check release commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release commit $GITHUB_SHA is not on main"
            exit 1
          fi
      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # don't risk publishing from a poisoned cache
      - name: Check tag matches package.json version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Release tag $TAG does not match package.json version $VERSION"
            exit 1
          fi
      - name: Determine npm dist-tag
        id: dist-tag
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          # A semver prerelease version (e.g. v1.1.0-rc.1) must be marked as a
          # GitHub pre-release, and vice versa, so a prerelease never becomes `latest`.
          case "$TAG" in
            *-*) IS_SEMVER_PRERELEASE=true ;;
            *) IS_SEMVER_PRERELEASE=false ;;
          esac
          if [ "$PRERELEASE" != "$IS_SEMVER_PRERELEASE" ]; then
            echo "::error::Release $TAG has GitHub pre-release=$PRERELEASE but semver prerelease=$IS_SEMVER_PRERELEASE"
            exit 1
          fi
          if [ "$PRERELEASE" = "true" ]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi
      - name: Install deps
        run: yarn install --frozen-lockfile
      - name: Install Playwright browsers
        run: yarn playwright install --with-deps chromium firefox webkit
      - name: Test
        run: yarn test
      - name: Publish
        run: npm publish --provenance --access public --tag "$DIST_TAG"
        env:
          DIST_TAG: ${{ steps.dist-tag.outputs.tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
